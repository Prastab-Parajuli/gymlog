<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Workout</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/gymlog.css}">
</head>
<body class="container">

    <h1>Workout</h1>

    <form th:action="@{/save}" th:object="${workoutLog}" method="post">

        <input type="hidden" th:field="*{id}">

        <label>Date:</label>
        <input type="date" th:field="*{date}">
        <span style="color:red" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></span>
        <br><br>

        <label>Exercise:</label>
        <select name="exerciseId">
            <option th:each="ex : ${exercises}"
                    th:value="${ex.id}"
                    th:text="${ex.name}"
                    th:selected="${workoutLog.exercise != null and workoutLog.exercise.id == ex.id}">
            </option>
        </select>
        <br><br>

        <label>Sets:</label>
        <input type="number" th:field="*{sets}">
        <span style="color:red" th:if="${#fields.hasErrors('sets')}" th:errors="*{sets}"></span>
        <br><br>

        <label>Reps:</label>
        <input type="number" th:field="*{reps}">
        <span style="color:red" th:if="${#fields.hasErrors('reps')}" th:errors="*{reps}"></span>
        <br><br>

        <label>Weight (kg):</label>
        <input type="number" step="0.5" th:field="*{weight}">
        <span style="color:red" th:if="${#fields.hasErrors('weight')}" th:errors="*{weight}"></span>
        <br><br>
        <button type="submit">Save</button>
    </form>

    <br>
    <a th:href="@{/loglist}">Back to list</a>

</body>
</html>
