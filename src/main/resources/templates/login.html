<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/gymlog.css}">
    
    
</head>
<body class="container">

    <h1>GymLog Login</h1>

    <div th:if="${param.error}" style="color: red;">
        Invalid username and password.
    </div>

    <div th:if="${param.logout}" style="color: green;">
        You have been signed out.
    </div>

    <form th:action="@{/login}" method="post">
        <div><label> User Name : <input type="text" name="username"/> </label></div>
        <div><label> Password: <input type="password" name="password"/> </label></div>
        <div><input type="submit" value="Sign In"/></div>
    </form>

        <hr/>
    <a class="btn btn-dark" href="/oauth2/authorization/github">Log in with GitHub</a>
    <div th:if="${param.registered}" style="color: green;">
        Account created. You can now sign in.
    </div>
    <p><a th:href="@{/register}">Create an account</a></p>
</body>
</html>
