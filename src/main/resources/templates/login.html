<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/gymlog.css}">
</head>
<body class="container">

    <h1>GymLog Login</h1>

    <div th:if="${param.error}" style="color: red;" role="alert">
        Invalid username and password.
    </div>

    <div th:if="${param.logout}" style="color: green;">
        You have been signed out.
    </div>

    <div th:if="${param.registered}" style="color: green;">
        Account created. You can now sign in.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username">User name:</label>
            <input type="text" id="username" name="username" autofocus/>
        </div>
        <div class="mb-3">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"/>
        </div>
        <div>
            <input type="submit" value="Sign In"/>
        </div>
    </form>

    <hr/>

    <a class="btn btn-dark" th:href="@{/oauth2/authorization/github}">Log in with GitHub</a>
    <p class="mt-3"><a th:href="@{/register}">Create an account</a></p>

</body>
</html>
