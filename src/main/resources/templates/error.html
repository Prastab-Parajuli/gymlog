<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/gymlog.css}">
    
</head>
<body class="container">

    <h1>Oops, something went wrong</h1>
    <p th:if="${status}">Status: <span th:text="${status}"></span></p>
    <p th:if="${message}" th:text="${message}"></p>

    <a class="btn btn-primary" th:href="@{/loglist}">Back to workouts</a>

</body>
</html>
