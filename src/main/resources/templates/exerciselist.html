<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Exercises</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="container">

    <h1>Exercises</h1>

    <table class="table table-striped">
        <tr>
            <th>Name</th><th>Muscle group</th><th>Actions</th>
        </tr>
        <tr th:each="ex : ${exercises}">
            <td th:text="${ex.name}"></td>
            <td th:text="${ex.muscleGroup}"></td>
            <td>
                <a th:href="@{/editexercise/{id}(id=${ex.id})}">Edit</a>
                <a class="btn btn-danger" sec:authorize="hasRole('ADMIN')"
                   th:href="@{/deleteexercise/{id}(id=${ex.id})}"
                   onclick="return confirm('Delete this exercise and all its workouts?')">
                    Delete
                </a>
            </td>
        </tr>
    </table>

    <a class="btn btn-success" th:href="@{/addexercise}">Add Exercise</a>
    <a class="btn btn-secondary" th:href="@{/loglist}">Back to workouts</a>

</body>
</html>
