<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>GymLog</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="container">

    <h1>GymLog – My Workouts</h1>
    <h3>Hello <span sec:authentication="name"></span>!</h3>

    <form th:action="@{/logout}" method="post">
        <input type="submit" value="Sign Out"/>
    </form>
    <br>

        <table class="table table-striped">
        <tr>
            <th>Date</th><th>Exercise</th><th>Sets</th><th>Reps</th><th>Weight (kg)</th>
            <th sec:authorize="hasRole('ADMIN')">Owner</th>
            <th>Actions</th>
        </tr>
        <tr th:each="log : ${logs}">
            <td th:text="${log.date}"></td>
            <td th:text="${log.exercise.name}"></td>
            <td th:text="${log.sets}"></td>
            <td th:text="${log.reps}"></td>
            <td th:text="${log.weight}"></td>
            <td sec:authorize="hasRole('ADMIN')" th:text="${log.owner}"></td>
            <td>
                <a th:href="@{/edit/{id}(id=${log.id})}">Edit</a>
                <form th:action="@{/delete/{id}(id=${log.id})}" method="post" style="display:inline">
                    <button class="btn btn-danger btn-sm" type="submit">Delete</button>
                </form>
            </td>
        </tr>
    </table>
        <nav th:if="${totalPages > 1}">
        <a class="btn btn-outline-secondary" th:if="${currentPage > 0}"
           th:href="@{/loglist(page=${currentPage - 1})}">Previous</a>
        <span>Page <span th:text="${currentPage + 1}"></span> of <span th:text="${totalPages}"></span></span>
        <a class="btn btn-outline-secondary" th:if="${currentPage + 1 < totalPages}"
           th:href="@{/loglist(page=${currentPage + 1})}">Next</a>
    </nav>
    <br>

    <a class="btn btn-success" th:href="@{/addlog}">Add Workout</a>
    <a class="btn btn-secondary" th:href="@{/exercises}">Manage exercises</a>

    <h3>View progress</h3>
    <ul>
        <li th:each="ex : ${exercises}">
            <a th:href="@{/progress/{id}(id=${ex.id})}" th:text="${ex.name}"></a>
        </li>
    </ul>

</body>
</html>
