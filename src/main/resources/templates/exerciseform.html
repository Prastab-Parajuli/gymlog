<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Exercise</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="container">

    <h1>Exercise</h1>

    <form th:action="@{/saveexercise}" th:object="${exercise}" method="post">

        <input type="hidden" th:field="*{id}">

        <label>Name:</label>
        <input type="text" th:field="*{name}">
        <span style="color:red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        <br><br>

        <label>Muscle group:</label>
        <input type="text" th:field="*{muscleGroup}">
        <br><br>

        <button type="submit">Save</button>
    </form>

    <br>
    <a th:href="@{/exercises}">Back to exercises</a>

</body>
</html>
