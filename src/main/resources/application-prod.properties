# Production settings (profile "prod"). Values come from environment variables.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# update keeps existing data between restarts (create would wipe it)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Neon closes idle connections, so don't keep idle ones in the pool
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.maximum-pool-size=5

# Render puts HTTPS in front of the app; this makes Spring build correct https:// URLs
server.forward-headers-strategy=framework